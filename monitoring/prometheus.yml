global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "niq-retail-api"
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "niq-model-monitoring"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
